<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Finance Pro</title>

<style>
  *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#667eea,#764ba2);

}



.admin-box{

width:380px;

padding:35px;

background:
rgba(255,255,255,0.15);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:
0 20px 40px rgba(0,0,0,.2);

text-align:center;

color:white;

}



.admin-box h1{

font-size:30px;

margin-bottom:10px;

}



.admin-box h2{

margin-bottom:25px;

font-weight:500;

}



.input{

width:100%;

padding:14px;

margin:10px 0;

border:none;

outline:none;

border-radius:12px;

background:white;

font-size:15px;

}



.btn{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

background:#00c853;

color:white;

font-size:17px;

cursor:pointer;

transition:.3s;

}



.btn:hover{

transform:scale(1.03);

}



.divider{

margin:20px 0;

position:relative;

}



.divider span{

background:transparent;

padding:0 10px;

}



.google-btn{

width:100%;

padding:13px;

border:none;

border-radius:12px;

background:white;

color:#333;

font-size:16px;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

cursor:pointer;

}



.google-btn img{

width:22px;

}



#message{

margin-top:15px;

font-size:14px;

}



@media(max-width:450px){

.admin-box{

width:90%;

}

  }
</style>

</head>


<body>


<div class="admin-box">


<h1>Finance Pro</h1>

<h2>Admin Login</h2>


<input
type="email"
id="adminEmail"
class="input"
placeholder="Admin Email">


<input
type="password"
id="adminPassword"
class="input"
placeholder="Password">



<button id="loginBtn" class="btn">
Login
</button>



<div class="divider">
<span>OR</span>
</div>



<button id="googleLogin" class="google-btn">

<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

Continue with Google

</button>



<p id="message"></p>


</div>



<script type="module" src="js/admin-login.js"></script>


</body>

</html>
