<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Savings | Finance Pro</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">

<i class="fa-solid fa-piggy-bank"></i>

<h2>Savings</h2>

</div>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

</a>

</header>

<section class="card" style="margin:20px;">

<h2>Add Savings</h2>

<form id="savingForm">

<input
type="number"
id="amount"
class="input"
placeholder="Saving Amount"
required>

<input
type="text"
id="goal"
class="input"
placeholder="Goal Name (Bike, Laptop, etc.)">

<input
type="date"
id="date"
class="input"
required>

<textarea
id="note"
class="input"
placeholder="Note"></textarea>

<button
type="submit"
class="btn">

Save Savings

</button>

</form>

</section>

<section class="card" style="margin:20px;">

<h2>Savings History</h2>

<div id="savingList">

</div>

</section>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/savings.js"></script>

</body>

</html>
