<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Goals | Finance Pro</title>


<link rel="stylesheet" href="css/style.css">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
  /* ==========================================
   Finance Pro
   Goals CSS
========================================== */

/* =================================
   Professional Home Button
================================= */


.header > a{


width:52px;

height:52px;


display:flex;

align-items:center;

justify-content:center;


border-radius:20px;


background:

linear-gradient(
145deg,
rgba(255,255,255,.15),
rgba(255,255,255,.05)
);


border:

1px solid rgba(255,255,255,.20);


backdrop-filter:blur(15px);


box-shadow:

0 8px 25px rgba(0,0,0,.25);


transition:.3s ease;


}



.header > a i{


font-size:24px;


color:#ffffff;


transition:.3s;


}





.header > a:hover{


transform:translateY(-3px) scale(1.05);


background:

linear-gradient(
135deg,
#4F46E5,
#7C3AED
);


box-shadow:

0 12px 30px rgba(79,70,229,.45);


}



.header > a:hover i{


transform:scale(1.1);


}






/* Mobile */

@media(max-width:600px){


.header > a{


width:46px;

height:46px;


border-radius:17px;


}



.header > a i{


font-size:21px;


}


}
/* Goal Form */

.goal-form{

    margin:20px;

    padding:25px;

    border-radius:22px;

    background:

    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:

    1px solid rgba(255,255,255,.15);

}



/* Goal List */

#goalList{

    display:flex;

    flex-direction:column;

    gap:20px;

}





/* Goal Card */

.goal-card{

    padding:25px;

    border-radius:22px;

    background:

    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:

    1px solid rgba(255,255,255,.15);

    animation:

    slideUp .5s ease;

}



.goal-card h2{

    margin-bottom:15px;

    color:#60a5fa;

}



.goal-card p{

    color:#cbd5e1;

    margin:8px 0;

}





/* Progress Background */


.progress{

    width:100%;

    height:15px;

    background:

    rgba(255,255,255,.2);

    border-radius:20px;

    overflow:hidden;

    margin:15px 0;

}





/* Progress Fill */


.goal-progress{

    height:100%;

    background:

    linear-gradient(

    90deg,

    #10b981,

    #22c55e

    );

    border-radius:20px;

    transition:.5s ease;

}





/* Delete Button */


.danger{

    background:#ef4444;

}



.danger:hover{

    background:#dc2626;

}





/* Completed Goal */


.goal-card.completed{

    border:

    2px solid #10b981;

}





/* Animation */


@keyframes slideUp{


from{

    opacity:0;

    transform:translateY(30px);

}


to{

    opacity:1;

    transform:translateY(0);

}


}





/* Mobile Responsive */


@media(max-width:768px){


.goal-form{

    margin:15px;

    padding:20px;

}



.goal-card{

    padding:20px;

}



.goal-card h2{

    font-size:20px;

}


}
</style>
</head>


<body>


<header class="header">


<div class="logo">

<i class="fa-solid fa-bullseye"></i>

<h2>My Goals</h2>

</div>


<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

</a>


</header>





<section class="card goal-form">


<h2>Create Goal</h2>



<form id="goalForm">


<input

type="text"

id="goalName"

class="input"

placeholder="Goal Name"

required>



<input

type="number"

id="targetAmount"

class="input"

placeholder="Target Amount"

required>



<input

type="number"

id="savedAmount"

class="input"

placeholder="Already Saved Amount"

value="0"

required>



<input

type="date"

id="deadline"

class="input"

required>



<button class="btn">

Create Goal

</button>



</form>


</section>







<section style="margin:20px">


<h2>

Your Goals

</h2>



<div id="goalList">


</div>



</section>







<script type="module" src="js/firebase.js"></script>

<script type="module" src="js/auth.js"></script>

<script type="module" src="js/goals.js"></script>



</body>

</html>
